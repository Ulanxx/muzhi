name: deploy

# 部署优化方案 A：构建在 GitHub 托管 runner 完成，产物直传香港服务器秒切。
# 服务器端只做：解压 → 软链切换 → pm2 重启（见 /opt/zmzai/scripts/receive-deploy.sh）。

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  APP_NAME: muzhi
  HK_HOST: 149.88.84.189
  HK_USER: root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 固定 pnpm 10.34.5 与服务器一致：pnpm 11 会把被忽略的构建脚本
      # (ERR_PNPM_IGNORED_BUILDS) 当硬错误，pnpm 10 只是警告（各仓库
      # pnpm-workspace.yaml 的 allowBuilds 是 sharp:false/占位符，生产不跑该脚本）
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_FETCH_TIMEOUT: "300000"
          PNPM_FETCH_RETRIES: "5"

      - name: Restore production env for build
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HK_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            ${HK_USER}@${HK_HOST} "envget ${APP_NAME}" > .env.production

      - name: Build
        run: pnpm build

      - name: Pack artifact
        run: |
          FILES=".next package.json pnpm-lock.yaml pnpm-workspace.yaml"
          for p in next.config.ts next.config.mjs next.config.js public messages content scripts middleware.ts src; do
            [ -e "$p" ] && FILES="$FILES $p"
          done
          tar -czf /tmp/${APP_NAME}-${{ github.sha }}.tar.gz \
            --exclude='node_modules' --exclude='.git' --exclude='.next/cache' \
            --exclude='.env*' --exclude='.vercel' $FILES

      - name: Upload & deploy to HK server
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            ${HK_USER}@${HK_HOST} "store ${APP_NAME} ${{ github.sha }}" \
            < /tmp/${APP_NAME}-${{ github.sha }}.tar.gz
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            ${HK_USER}@${HK_HOST} "deploy ${APP_NAME} ${{ github.sha }}"
